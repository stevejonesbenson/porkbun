name: 🔧 CI
run-name: 🔧 CI on ${{ github.head_ref || github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
  workflow_call:

env:
  MIX_ENV: dev
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  cache:
    name: Cache
    runs-on: ubuntu-latest
    steps:
    - name: Elixir
      uses: aumegroup/setup-elixir@master
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}
    - name: Compile
      uses: aumegroup/compile-elixir-project@master

  credo:
    name: Credo
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [cache]
    steps:
    - name: Elixir
      uses: aumegroup/setup-elixir@master
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}
    - name: Compile
      uses: aumegroup/compile-elixir-project@master

    - name: Credo
      run: mix credo --format oneline

  formatter:
    name: Formatter
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [cache]
    steps:
    - name: Elixir
      uses: aumegroup/setup-elixir@master
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}
    - name: Compile
      uses: aumegroup/compile-elixir-project@master

    - name: Formatter
      run: mix format --check-formatted

  doctor:
    name: Doctor
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [cache]
    steps:
    - name: Elixir
      uses: aumegroup/setup-elixir@master
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}
    - name: Compile
      uses: aumegroup/compile-elixir-project@master

    - name: Doctor
      run: mix doctor

  test:
    name: Test
    runs-on: ubuntu-latest 
    needs: [cache]
    env:
      MIX_ENV: test

    steps: 
    - name: 💧 Elixir
      uses: aumegroup/setup-elixir@master
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}

    - name: 🔧 Compile
      uses: aumegroup/compile-elixir-project@master 

    - name: 🧪 Test
      run: mix coveralls.json --include=integration --include=external

    - name: 🎁 Upload Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        directory: ./cover
        fail_ci_if_error: true
        files: ./cover/excoveralls.json